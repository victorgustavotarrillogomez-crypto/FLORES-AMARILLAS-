<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Flores para ti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" aria-label="Animación de girasoles">

    <div class="vignette" aria-hidden="true"></div>

      <h1 class="intro-title">Flores Amarillas <span>Para Ti</span></h1>
      <button id="startButton" class="start-button" type="button">

      </button>
    </section>
    <div id="endMessage" class="end-message" aria-live="polite"></div>

  </main>
  <script src="script.js"></script>

</html>
